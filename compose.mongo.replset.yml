services:
  mongo:
    image: mongo:7
    container_name: keystone4-mongo-rs
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-rs-data:/data/db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { const hello = db.adminCommand({ hello: 1 }); if (hello.setName === "rs0" && hello.isWritablePrimary) quit(0); if (hello.isreplicaset && !hello.setName) { try { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }); } catch (_) {} } } catch (error) { try { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }); } catch (_) {} } quit(1);'
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mongo-rs-data:
    name: keystone4-mongo-rs-data
