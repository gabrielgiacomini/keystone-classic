name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily main-branch parity signal for the required two-week P4 soak.
    - cron: '17 8 * * *'

jobs:
  lint-typecheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run admin-next:typecheck

  package-verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run ci:verify
      - run: npm run admin-next:build
      - run: npm run build:types
      - run: npm run package:verify
      - run: npm pack --dry-run

  prod-audit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm audit --omit=dev

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test-unit
        env:
          MONGO_URI: mongodb://localhost:27017/keystone-test

  e2e-api:
    if: github.event_name != 'schedule'
    # API-only Playwright suite (roadmap step 38a). HTTP requests against
    # /keystone-api/* — no browser, no UI assertions. The webServer block
    # in e2e-api/playwright.config.ts boots a real Keystone process via
    # `npm run dev:e2e-api` against the mongo:7 service container below.
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      # API-only suite: Playwright's `request` fixture only — no
      # browser binaries needed, so we deliberately skip
      # `npx playwright install --with-deps`.
      - run: npm run test:e2e-api
        env:
          MONGO_URI: mongodb://localhost:27017/keystone-e2e-api
          DISABLE_CSRF: 'true'
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-test-results
          path: |
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: ignore

  e2e-ui:
    if: github.event_name != 'schedule'
    # UI-driven Playwright smoke/parity suite. Drives a real Chromium
    # browser through both admin legacy (/keystone) and admin next
    # (/keystone-next), with both UIs sharing /keystone-api.
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      # UI suite needs a real chromium binary.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e-ui
        env:
          MONGO_URI: mongodb://localhost:27017/keystone-e2e-ui
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ui-test-results
          path: |
            test-results
            e2e-ui/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  legacy-bundle-hash:
    # Verifies that the legacy admin JS bundles (packages.js, admin.js,
    # signin.js, fields.js) have not changed since the committed baseline in
    # .roadmap/legacy-admin-typing/legacy-bundle-baseline.md.
    # A hash change means a runtime behavior change was introduced — this must
    # never happen silently. The baseline is updated intentionally (with a
    # justified explanation) when a new .d.mts sidecar causes the copy-dist
    # path to pick up the original source indentation instead of tsc-reformatted
    # output. Zero hash drift is the load-bearing safety check for the migration.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build legacy admin bundles
        run: NODE_ENV=production jiti scripts/build-legacy-admin-bundles.ts
      - name: Verify bundle hashes against baseline
        run: |
          set -e
          # Compute current hashes
          PACKAGES_HASH=$(md5sum admin/public-legacy/js/packages.js | awk '{print $1}')
          ADMIN_HASH=$(md5sum admin/public-legacy/js/admin.js | awk '{print $1}')
          SIGNIN_HASH=$(md5sum admin/public-legacy/js/signin.js | awk '{print $1}')
          FIELDS_HASH=$(md5sum admin/public-legacy/js/fields.js | awk '{print $1}')
          # Expected hashes from baseline
          EXPECTED_PACKAGES="faaf6ef820ef473df15b91907ea1c360"
          EXPECTED_ADMIN="cd51d89c6fcaafca39d374af93ad12eb"
          EXPECTED_SIGNIN="3090cc8b46289c0c8c1c42cf8fc51f45"
          EXPECTED_FIELDS="54f5d726f0c1eb3855603d0152f39247"
          FAIL=0
          if [ "$PACKAGES_HASH" != "$EXPECTED_PACKAGES" ]; then
            echo "ERROR: packages.js hash mismatch: got $PACKAGES_HASH expected $EXPECTED_PACKAGES"
            FAIL=1
          fi
          if [ "$ADMIN_HASH" != "$EXPECTED_ADMIN" ]; then
            echo "ERROR: admin.js hash mismatch: got $ADMIN_HASH expected $EXPECTED_ADMIN"
            FAIL=1
          fi
          if [ "$SIGNIN_HASH" != "$EXPECTED_SIGNIN" ]; then
            echo "ERROR: signin.js hash mismatch: got $SIGNIN_HASH expected $EXPECTED_SIGNIN"
            FAIL=1
          fi
          if [ "$FIELDS_HASH" != "$EXPECTED_FIELDS" ]; then
            echo "ERROR: fields.js hash mismatch: got $FIELDS_HASH expected $EXPECTED_FIELDS"
            FAIL=1
          fi
          if [ $FAIL -eq 1 ]; then
            echo ""
            echo "Bundle hash mismatch detected. This means the legacy admin JS changed."
            echo "If this is intentional (new .d.mts sidecar, SWC artifact), update the"
            echo "baseline in .roadmap/legacy-admin-typing/legacy-bundle-baseline.md with"
            echo "a justified explanation. Otherwise investigate the change."
            exit 1
          fi
          echo "All bundle hashes match the baseline."

  admin-parity:
    # UI parity Playwright suite (roadmap step P4-30). Drives a real
    # Chromium browser against BOTH admin legacy (/keystone) and admin
    # next (/keystone-next), then runs the field-complete project from
    # P6-38b. Both suites share the canonical /keystone-api surface.
    runs-on: ubuntu-latest
    needs: []
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e-ui
        env:
          MONGO_URI: mongodb://localhost:27017/keystone-e2e-ui
          CI: 'true'
      - run: npm run test:e2e-ui:fields
        env:
          MONGO_URI: mongodb://localhost:27017/keystone-e2e-ui-fields
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-parity-test-results
          path: |
            test-results
            e2e-ui/playwright-report
            e2e-ui/playwright-report-fields
            playwright-report-fields
          retention-days: 7
          if-no-files-found: ignore
