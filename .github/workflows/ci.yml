name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily main-branch parity signal for the required two-week P4 soak.
    - cron: '17 8 * * *'

jobs:
  lint-typecheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm run admin-next:typecheck

  package-verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run ci:verify
      - run: npm run admin-next:build
      - run: npm run build:types
      - run: npm run package:verify
      - run: npm pack --dry-run

  prod-audit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm audit --omit=dev

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test-unit
        env:
          MONGO_URI: mongodb://localhost:27017/keystone-test

  e2e-api:
    if: github.event_name != 'schedule'
    # API-only Playwright suite (roadmap step 38a). HTTP requests against
    # /keystone-api/* — no browser, no UI assertions. The webServer block
    # in e2e-api/playwright.config.ts boots a real Keystone process via
    # `npm run dev:e2e-api` against the mongo:7 service container below.
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run admin-next:build
      # API-only suite: Playwright's `request` fixture only — no
      # browser binaries needed, so we deliberately skip
      # `npx playwright install --with-deps`.
      - run: npm run test:e2e-api
        env:
          MONGO_URI: mongodb://localhost:27017/keystone-e2e-api
          DISABLE_CSRF: 'true'
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-test-results
          path: |
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: ignore

  e2e-ui:
    if: github.event_name != 'schedule'
    # UI-driven Playwright smoke/parity suite. Drives a real Chromium
    # browser through both admin legacy (/keystone) and admin next
    # (/keystone-next), with both UIs sharing /keystone-api.
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      # UI suite needs a real chromium binary.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e-ui
        env:
          MONGO_URI: mongodb://localhost:27017/keystone-e2e-ui
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ui-test-results
          path: |
            test-results
            e2e-ui/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  admin-parity:
    # UI parity Playwright suite (roadmap step P4-30). Drives a real
    # Chromium browser against BOTH admin legacy (/keystone) and admin
    # next (/keystone-next), then runs the field-complete project from
    # P6-38b and the targeted visual identity guard. These suites share
    # the canonical /keystone-api surface.
    runs-on: ubuntu-latest
    needs: []
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e-ui
        env:
          MONGO_URI: mongodb://localhost:27017/keystone-e2e-ui
          CI: 'true'
      - run: npm run test:e2e-ui:fields
        env:
          MONGO_URI: mongodb://localhost:27017/keystone-e2e-ui-fields
          CI: 'true'
      - run: npm run test:e2e-ui:visual
        env:
          MONGO_URI: mongodb://localhost:27017/keystone-e2e-ui-visual
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-parity-test-results
          path: |
            test-results
            e2e-ui/playwright-report
            e2e-ui/playwright-report-fields
            playwright-report-fields
          retention-days: 7
          if-no-files-found: ignore
